[tool.poetry]

[project]
name = "habushu_mixology"
version = "2.18.1"
description = "Example of how to use the habushu-maven-plugin"
authors = [{name = "Eric Konieczny", email = "ekoniec1@gmail.com"}]
license = "MIT License"
requires-python = "^3.11"
dynamic = ["version", "dependencies"]

[tool.poetry.dependencies]
krausening = "19"
cryptography = "^42.0.0"
uvicorn = {version = "^0.18.0", extras = ["standard"]}


[tool.poetry.group.dev.dependencies]
behave = ">=1.2.6"
pylint = ">=3.1.0"
black = ">=24.3.0"
python-dotenv = "^0.20.0"
grpcio-tools = "^1.48.0"
kappa-maki = ">=1.0.0"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"


# Added by habushu-maven-plugin at 2024-05-06T17:43:13.504546 to use https://test.pypi.org/simple/ as source PyPi repository for installing dependencies
[[tool.poetry.source]]
name = "dev-pypi"
url = "https://test.pypi.org/simple/"
priority = "supplemental"
