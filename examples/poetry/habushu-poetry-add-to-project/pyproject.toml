[tool.poetry]
packages = [{include = "habushu_poetry_add_to_project", from = "src"}]

[project]
name = "habushu-poetry-add-to-project"
version = "3.0.0.dev"
description = "This example demonstrates how to add Habushu to a new or existing Poetry project."
authors = [{name = "Margaret Black", email = "black_margaret@bah.com"}]
dynamic = ["version", "dependencies"]
readme = "README.md"
requires-python = ">=3.12,<4"

[tool.poetry.dependencies]

[tool.poetry.group.dev.dependencies]
behave = "^1.2.6"
kappa-maki = "^1.0.2"
ruff = ">=0.9.9"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.format]
indent-style="space"
line-ending="lf"
quote-style="preserve"

[tool.ruff.lint]
ignore = ["E4","E7","F"]
