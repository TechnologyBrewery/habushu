[project]
name = "habushu_poetry_package_consumer"
version = "3.0.0.dev"
description = "Example of how to use the habushu-maven-plugin to consume other Habushu modules"
authors = [{name = "Eric Konieczny", email = "ekoniec1@gmail.com"}]
license = "MIT License"
requires-python = ">=3.12"
dynamic = ["version", "dependencies"]

[tool.poetry.dependencies]
habushu-poetry-package = {path = "../habushu-poetry-package", develop = true}

[tool.poetry.group.dev.dependencies]
behave = ">=1.2.6"
kappa-maki = ">=1.0.0"
ruff = ">=0.9.9"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.format]
indent-style="space"
line-ending="lf"
quote-style="preserve"

[tool.ruff.lint]
ignore = ["E4","E7","F"]
