[tool.poetry]

[project]
name = "habushu_poetry_package"
version = "3.0.0.dev"
description = "Example of how to use the habushu-maven-plugin"
authors = [{name = "Eric Konieczny", email = "ekoniec1@gmail.com"}]
license = "MIT License"
requires-python = ">=3.11"
dynamic = ["version", "dependencies"]

[tool.poetry.dependencies]
krausening = ">=20"
cryptography = ">=44.0.1"
uvicorn = ">=0.19.0"


[tool.poetry.group.dev.dependencies]
behave = ">=1.2.6"
python-dotenv = "^0.20.0"
grpcio-tools = "^1.48.0"
kappa-maki = ">=1.0.0"
ruff = ">=0.9.9"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"


# Added by habushu-maven-plugin at 2024-05-06T17:43:13.504546 to use https://test.pypi.org/simple/ as source PyPi repository for installing dependencies
[[tool.poetry.source]]
name = "dev-pypi"
url = "https://test.pypi.org/simple/"
priority = "supplemental"

[tool.ruff.format]
indent-style="space"
line-ending="lf"
quote-style="preserve"

[tool.ruff.lint]
ignore = ["E4","E7","F"]