[project]
name = "add-habushu-to-new-or-existing-uv-project"
version = "3.0.0.dev"
description = "This example demonstrates how to add Habushu to a new or existing uv project."
readme = "README.md"
authors = [
    { name = "Margaret Black", email = "black_margaret@bah.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ruff>=0.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.format]
indent-style="space"
line-ending="lf"
quote-style="preserve"

[tool.ruff.lint]
ignore = ["E4","E7","F"]

[dependency-groups]
dev = [
    "behave>=1.2.6",
    "kappa-maki>=1.0.2",
]


# Added by habushu-maven-plugin at 2025-03-18T10:40:05.176687 to use https://pypi.org/simple/ as source PyPi repository for installing dependencies
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://pypi.org/simple/"


# Added by habushu-maven-plugin at 2025-03-18T10:40:05.178201 to use https://test.pypi.org/simple/ as source PyPi repository for installing dependencies
[[tool.uv.index]]
name = "dev-pypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
priority = "supplemental"
