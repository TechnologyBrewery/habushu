[project]
authors = [
    {name = "James Choi", email = "choi_james@bah.com"},
]
license = {text = "MIT License"}
requires-python = ">=3.12"
dependencies = [
    "krausening>=20",
    "cryptography>=44.0.1",
    "uvicorn[standard]>=0.19.0",
]
name = "habushu_uv_package"
version = "3.0.0.dev"
description = "Example of how to use the habushu-maven-plugin in a `uv`-based setting"
readme = "README.md"

[dependency-groups]
dev = [
    "behave>=1.2.6",
    "ruff>=0.9.9",
    "python-dotenv<1.0.0,>=0.20.0",
    "grpcio-tools>=1.48.0",
    "kappa-maki>=1.0.0",
    "ruff>=0.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
ignore = ["E4","E7","F"]

[tool.ruff.format]
indent-style="space"
line-ending="lf"
quote-style="preserve"

# Added by habushu-maven-plugin at 2025-04-09T09:49:04.175061 to use https://pypi.org/simple/ as source repository for installing dependencies
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://pypi.org/simple/"


# Added by habushu-maven-plugin at 2025-04-09T09:49:04.176397 to use https://test.pypi.org/simple/ as source PyPi repository for installing dependencies
[[tool.uv.index]]
name = "dev-pypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
