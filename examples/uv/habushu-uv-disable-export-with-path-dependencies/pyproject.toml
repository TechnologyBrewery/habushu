[project]
name = "habushu-uv-disable-export-with-path-dependencies"
version = "3.0.0.dev"
description = "This example demonstrates how to disable the exportRequirementsWithoutPathDependencies configuration in a uv project."
readme = "README.md"
authors = [
    { name = "Margaret Black", email = "black_margaret@bah.com" }
]
requires-python = ">=3.12"
dependencies = [
    "habushu-uv-package",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
habushu-uv-package = { path = "../habushu-uv-package", editable = true }

[tool.ruff.format]
indent-style="space"
line-ending="lf"
quote-style="preserve"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]


# Added by habushu-maven-plugin at 2025-03-18T10:40:07.659305 to use https://pypi.org/simple/ as source PyPi repository for installing dependencies
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://pypi.org/simple/"


# Added by habushu-maven-plugin at 2025-03-18T10:40:07.660203 to use https://test.pypi.org/simple/ as source PyPi repository for installing dependencies
[[tool.uv.index]]
name = "dev-pypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
priority = "supplemental"
