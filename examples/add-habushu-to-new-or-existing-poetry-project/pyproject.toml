[tool.poetry]
name = "add-habushu-to-new-or-existing-poetry-project"
version = "3.0.0.dev"
description = "This example demonstrates how to add Habushu to a new or existing Poetry project."
authors = ["Margaret Black <black_margaret@bah.com>"]
readme = "README.md"
packages = [{include = "add_habushu_to_new_or_existing_poetry_project", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"


[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
pylint = "^3.3.4"
behave = "^1.2.6"
kappa-maki = "^1.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# Added by habushu-maven-plugin at 2025-02-25T15:38:56.068690 to use https://test.pypi.org/simple/ as source PyPi repository for installing dependencies
[[tool.poetry.source]]
name = "dev-pypi"
url = "https://test.pypi.org/simple/"
priority = "supplemental"
