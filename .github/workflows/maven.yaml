# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build Habushu

on:
    push:
        branches: [ "dev" ]
    pull_request_review:
      types: [submitted]
    workflow_dispatch:
      inputs:
        branch:
          description: 'Branch to build'
          required: true
          default: 'dev'
          type: string

jobs:
    build:
        if: github.event.review.state == 'approved' || github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
            - name: Install Python # use direct install rather than pyenv for CI for large speed improvement
              uses: actions/setup-python@v5
              with:
                python-version: '3.12.9'

            - name: Load cached Poetry installation
              id: cached-poetry
              uses: actions/cache@v4
              with:
                path: ~/.local
                key: poetry-0  # increment to reset cache

            - name: Install Poetry
              if: steps.cached-poetry.outputs.cache-hit != 'true'
              uses: snok/install-poetry@v1

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                # Install a specific version of uv.
                version: "0.6.1"

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: maven

            - name: Build habushu-maven-plugin
              run: mvn -B install -Pbootstrap --file pom.xml

            - name: Test habushu-maven-plugin
              run: mvn -B install --file pom.xml -Dhabushu.usePyenv=false
