[tool.poetry]
name = "extensions-python-dep-X"
#Note: we use .dev to test snapshots, and because the implied 0 of dev becomes explicit in the wheel name.
version = "1.0.0.dev"
description = "description"
authors = ["author"]
packages = [
    {include = "python_dep_x", from = "src"},
]

[tool.poetry.dependencies]
python = ">=3.11.4, <4"
aissemble-foundation-core-python = "1.13.0.*"
renamed-python-dep-Y = {path = "../../foundation/foundation-python-dep-Y", develop=true}

[tool.poetry.group.dev.dependencies]
black = ">=22.1.0"
behave = ">=1.2.6"
nose = ">=1.3.7"
pylint = "^3.2.3"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "dev-pypi"
url = "https://test.pypi.org/simple/"
priority = "supplemental"