[project]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
authors = [
    {name = "James Choi", email = "choi_james@bah.com"},
]
license = {text = "MIT License"}
requires-python = "<4.0,>=3.9"
dependencies = [
    "krausening==16",
    "cryptography<40.0.0,>=39.0.1",
    "package-a==1.0.0",
]
name = "habushu_uv_package"
version = "2.4.0.dev"
description = "Example of how to use the habushu-maven-plugin"

[dependency-groups]
dev = [
    "ruff<1.0.0,>=0.9.9",
    "behave<2.0.0,>=1.2.6",
    "grpcio-tools<2.0.0,>=1.48.0",
    "python-dotenv<1.0.0,>=0.20.0",
    "uvicorn[standard]<1.0.0,>=0.16.0",
    "package-b==1",
    "local-dev-package-example-a @ file:///${PROJECT_ROOT}/../local-dev-package-example-a",
    "behave-cucumber-formatter>=1.0.1",
]
custom = [
    "packageFoo<2.0.0,>=1.0.0",
    "packageBar<3.0.0,>=2.0.0",
    "local-dev-package-example-b @ file:///${PROJECT_ROOT}/../local-dev-package-example-b",
]
test = [
    "packageFooTest^10.0",
    "packageBarTest ^23"
]