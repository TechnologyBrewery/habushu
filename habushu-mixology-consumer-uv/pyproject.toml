[[tool.pdm.source]]
name = "dev-pypi"
url = "https://test.pypi.org/simple/"
verify_ssl = true

[project]
authors = [
    {name = "Eric Konieczny", email = "ekoniec1@gmail.com"},
]
license = {text = "MIT License"}
requires-python = "<4.0,>=3.11"
dependencies = [
    "habushu-mixology @ file:///${PROJECT_ROOT}/../habushu-mixology",
]
name = "habushu_mixology_consumer"
version = "2.18.0.dev"
description = "Example of how to use the habushu-maven-plugin to consume other Habushu modules"

[dependency-groups]
dev = [
    "behave>=1.2.6",
    "black>=24.3.0",
    "kappa-maki>=1.0.0",
    "pylint>=3.1.0",
]
